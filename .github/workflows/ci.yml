name: CI
on: [push, pull_request]
jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: TeX Live (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: MiKTeX (Windows)
        if: runner.os == 'Windows'
        run: choco install miktex -y --no-progress
      - run: pip install pytest && pip install -e .
      - run: pytest -q
  # Geplant: windows-latest-Job fuer WinUI-3-Build (dotnet build), sobald das C#-Projekt existiert.
