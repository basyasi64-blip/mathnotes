name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  python-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: TeX Live (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: MiKTeX (Windows)
        if: runner.os == 'Windows'
        run: choco install miktex -y --no-progress
      - run: pip install pytest && pip install -e .
      - run: pytest -q

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Core-Tests (C#)
        run: dotnet test windows/MathNotes.Core.Tests -c Release
      - name: WinUI-App veroeffentlichen (portable, self-contained, x64)
        run: dotnet publish windows/MathNotes.App/MathNotes.App.csproj -c Release -r win-x64 -p:Platform=x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MathNotes-win-x64-portable
          path: publish
